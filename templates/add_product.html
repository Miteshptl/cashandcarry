{% extends 'base.html' %}

{% block title %}Add Product — CnC{% endblock %}

{% block extra_css %}
<style>
  .product-form-wrapper {
    max-width: 680px;
    margin: 0 auto;
    width: 100%;
  }

  .product-form-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 16px;
  }
  @media (min-width: 600px) {
    .product-form-card {
      padding: 32px;
    }
  }

  /* Responsive Grid Field Layouts */
  .grid-2col {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 600px) {
    .grid-2col {
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
  }

  .grid-3col {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 600px) {
    .grid-3col {
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
  }

  .admin-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px; /* Prevents auto-zoom on mobile */
    font-family: var(--font-body);
    color: var(--charcoal);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s ease;
  }
  @media (min-width: 600px) {
    .admin-input {
      font-size: 14px;
    }
  }
  .admin-input:focus {
    border-color: var(--leaf);
  }

  .admin-file-input {
    width: 100%;
    font-size: 13px;
    color: var(--charcoal-soft);
  }

  .form-actions-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  @media (max-width: 480px) {
    .form-actions-row {
      flex-direction: column-reverse;
    }
    .form-actions-row .btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
{% endblock %}

{% block content %}
<section class="section" style="padding: 24px 0 60px; min-height: 70vh;">
  <div class="wrap product-form-wrapper">
    <div class="product-form-card">
      
      <span class="mono" style="font-size: 11px; color: var(--turmeric-dark); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;">Catalog Management</span>
      <h1 class="display" style="font-size: 22px; color: var(--charcoal); margin-top: 2px; margin-bottom: 18px;">Add New Product</h1>

      <!-- Multi-part Form for File Upload Support -->
      <form method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        
        <!-- Product Name & Category -->
        <div class="grid-2col">
          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Product Name *</label>
            <input type="text" name="name" required placeholder="e.g. Fresh Tomatoes" class="admin-input">
          </div>

          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Category *</label>
            <select name="category" required class="admin-input" style="font-weight: 500;">
              {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <!-- Brand & Packaging Unit -->
        <div class="grid-2col">
          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Brand Name</label>
            <input type="text" name="brand" placeholder="e.g. Local / Amul" class="admin-input">
          </div>

          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Unit / Packaging *</label>
            <input type="text" name="unit" required placeholder="e.g. 500g / 1 kg / Piece" class="admin-input">
          </div>
        </div>

        <!-- Price, Discount Price, Stock -->
        <div class="grid-3col">
          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Price (₹) *</label>
            <input type="number" step="0.01" name="price" required placeholder="50.00" class="mono admin-input">
          </div>

          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Discount Price (₹)</label>
            <input type="number" step="0.01" name="discounted_price" placeholder="40.00" class="mono admin-input">
          </div>

          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Initial Stock Qty *</label>
            <input type="number" name="initial_stock" value="10" required class="mono admin-input">
          </div>
        </div>

        <!-- Dual Image Options -->
        <div style="border: 1px dashed var(--line); border-radius: 12px; padding: 14px; background: var(--mist); display: flex; flex-direction: column; gap: 12px;">
          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal); display: block; margin-bottom: 4px;">Option A: Upload Local Image File</label>
            <input type="file" name="image" accept="image/*" class="admin-file-input">
          </div>

          <div style="text-align: center; font-size: 11px; font-weight: 700; color: var(--charcoal-soft);" class="mono">— OR —</div>

          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal); display: block; margin-bottom: 4px;">Option B: Image URL</label>
            <input type="url" name="image_url" placeholder="https://images.unsplash.com/photo-..." class="admin-input">
          </div>
        </div>

        <!-- Description -->
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Description</label>
          <textarea name="description" rows="3" placeholder="Brief product description..." class="admin-input" style="resize: vertical;"></textarea>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions-row">
          <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="padding: 11px 18px; min-height: 44px; font-size: 13px;">Cancel</a>
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center; padding: 11px; min-height: 44px; font-size: 14px;">Save Product</button>
        </div>

      </form>
    </div>
  </div>
</section>
{% endblock %}
