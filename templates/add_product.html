{% extends 'base.html' %}

{% block title %}Add Product — CnC{% endblock %}

{% block content %}
<section class="section">
  <div class="wrap">
    <div style="max-width: 680px; margin: 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 32px;">
      <span class="mono" style="font-size: 11px; color: var(--turmeric-dark); font-weight: 600; text-transform: uppercase;">Catalog Management</span>
      <h1 class="display" style="font-size: 24px; color: var(--charcoal); margin-top: 2px; margin-bottom: 20px;">Add New Product</h1>

      <!-- ⚠️ MUST include enctype="multipart/form-data" for local file uploads -->
      <form method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Product Name</label>
            <input type="text" name="name" required placeholder="e.g. Fresh Tomatoes" style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter';">
          </div>

          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Category</label>
            <select name="category" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; font-family: 'Inter'; font-weight: 500;">
              {% for cat in categories %}
                <option value="{{ cat.id }}">{{ cat.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Brand Name</label>
            <input type="text" name="brand" placeholder="e.g. Local / Amul" style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter';">
          </div>

          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Unit / Packaging</label>
            <input type="text" name="unit" required placeholder="e.g. 500g / 1 kg / Piece" style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter';">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Price (₹)</label>
            <input type="number" step="0.01" name="price" required placeholder="50.00" style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px;" class="mono">
          </div>

          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Discount Price (₹)</label>
            <input type="number" step="0.01" name="discounted_price" placeholder="40.00" style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px;" class="mono">
          </div>

          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Initial Stock Qty</label>
            <input type="number" name="initial_stock" value="10" required style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px;" class="mono">
          </div>
        </div>

        <!-- 🖼️ Dual Image Options -->
        <div style="border: 1px dashed var(--line); border-radius: 12px; padding: 16px; background: var(--mist); display: flex; flex-direction: column; gap: 12px;">
          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal); display: block; margin-bottom: 4px;">Option A: Upload Local Image File</label>
            <input type="file" name="image" accept="image/*" style="width: 100%; font-size: 13px;">
          </div>

          <div style="text-align: center; font-size: 11px; font-weight: 700; color: var(--charcoal-soft);" class="mono">— OR —</div>

          <div>
            <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal); display: block; margin-bottom: 4px;">Option B: Image URL</label>
            <input type="url" name="image_url" placeholder="https://images.unsplash.com/photo-..." style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter';">
          </div>
        </div>

        <div>
          <label style="font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Description</label>
          <textarea name="description" rows="3" placeholder="Brief product description..." style="width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; outline: none; font-family: 'Inter';"></textarea>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 8px;">
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center; padding: 12px;">Save Product</button>
          <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="padding: 12px 18px;">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
