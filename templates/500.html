<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporary System Error — CnC</title>
  <style>
    :root {
      --charcoal: #1e293b;
      --charcoal-soft: #64748b;
      --leaf: #2f6b4f;
      --mist: #f8fafc;
      --line: #e2e8f0;
      --white: #ffffff;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--mist);
      color: var(--charcoal);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .error-card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 480px;
      margin: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: var(--leaf);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div style="font-size: 56px; margin-bottom: 12px;">⚠️</div>
    <span style="font-size: 13px; color: #dc2626; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;">Error 500</span>
    <h1 style="font-size: 24px; font-weight: 700; margin: 8px 0 12px;">Something Went Wrong</h1>
    <p style="font-size: 14px; color: var(--charcoal-soft); line-height: 1.5; margin: 0;">
      We encountered an unexpected server issue while loading this page. Our team has been notified.
    </p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
