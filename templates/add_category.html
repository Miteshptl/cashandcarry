{% extends 'base.html' %}

{% block title %}Add Category — CnC{% endblock %}

{% block extra_css %}
<style>
  .form-card-wrapper {
    max-width: 540px;
    margin: 0 auto;
    width: 100%;
  }

  .form-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 16px;
  }
  @media (min-width: 600px) {
    .form-card {
      padding: 32px;
    }
  }

  .admin-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 16px; /* Prevents auto-zoom on mobile */
    font-family: var(--font-body);
    color: var(--charcoal);
    background: var(--white);
    outline: none;
    transition: border-color 0.2s ease;
  }
  @media (min-width: 600px) {
    .admin-input {
      font-size: 14px;
    }
  }
  .admin-input:focus {
    border-color: var(--leaf);
  }

  .admin-file-input {
    width: 100%;
    font-size: 13px;
    color: var(--charcoal-soft);
  }

  .form-actions-row {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }
  @media (max-width: 480px) {
    .form-actions-row {
      flex-direction: column-reverse;
    }
    .form-actions-row .btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
{% endblock %}

{% block content %}
<section class="section" style="padding: 24px 0 60px; min-height: 70vh;">
  <div class="wrap form-card-wrapper">
    
    <div class="form-card">
      <span class="mono" style="font-size: 11px; color: var(--turmeric-dark); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;">Catalog Management</span>
      <h1 class="display" style="font-size: 22px; color: var(--charcoal); margin-top: 2px; margin-bottom: 18px;">Add New Category</h1>

      <form method="post" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 16px;">
        {% csrf_token %}
        
        <!-- Category Name -->
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Category Name *</label>
          <input type="text" name="name" required placeholder="e.g. Fruits &amp; Vegetables" class="admin-input">
        </div>

        <!-- Parent Category -->
        <div>
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal-soft); display: block; margin-bottom: 6px;">Parent Category (Optional)</label>
          <select name="parent_category" class="admin-input" style="font-weight: 500;">
            <option value="">None (Top-Level Category)</option>
            {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Category Image Upload Options -->
        <div style="border: 1px dashed var(--line); border-radius: 12px; padding: 14px; background: var(--mist); display: flex; flex-direction: column; gap: 12px;">
          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal); display: block; margin-bottom: 4px;">Option A: Upload Local Image File</label>
            <input type="file" name="image" accept="image/*" class="admin-file-input">
          </div>

          <div style="text-align: center; font-size: 11px; font-weight: 700; color: var(--charcoal-soft);" class="mono">— OR —</div>

          <div>
            <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--charcoal); display: block; margin-bottom: 4px;">Option B: External Image URL</label>
            <input type="url" name="image_url" placeholder="https://images.unsplash.com/photo-..." class="admin-input">
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-actions-row">
          <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="padding: 11px 18px; min-height: 44px; font-size: 13px;">Cancel</a>
          <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center; padding: 11px; min-height: 44px; font-size: 14px;">Save Category</button>
        </div>
      </form>
    </div>

  </div>
</section>
{% endblock %}
