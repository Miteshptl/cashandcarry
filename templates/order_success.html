{% extends 'base.html' %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow-sm border-0 p-5 mx-auto" style="max-width: 500px;">
    <div class="mb-3 text-success">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l4.992-5.99a.75.75 0 0 0-.018-1.042z"/>
      </svg>
    </div>
    <h2 class="fw-bold mb-2">Order Confirmed!</h2>
    <p class="text-muted">Thank you for your purchase. Your order number is <strong>#{{ order.id }}</strong>.</p>
    <p class="small text-secondary">Total Amount: ₹{{ order.total_amount }} | Payment: {{ order.payment_method }}</p>
    <div class="mt-4">
      <a href="{% url 'home' %}" class="btn btn-primary px-4 me-2">Back to Home</a>
      <a href="{% url 'product_list' %}" class="btn btn-outline-secondary px-4">Continue Shopping</a>
    </div>
  </div>
</div>
{% endblock %}
