{% extends 'base.html' %}

{% block title %}Logged Out — CnC Supermarket{% endblock %}

{% block content %}
<section class="section">
  <div class="wrap">
    <div style="max-width: 440px; margin: 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; text-align: center;">
      
      <!-- Icon -->
      <div style="width: 56px; height: 56px; background: rgba(47, 107, 79, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; color: var(--leaf);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>

      <!-- Heading -->
      <span class="mono" style="font-size: 11px; color: var(--turmeric-dark); font-weight: 600; text-transform: uppercase;">
        Session Ended
      </span>
      <h1 class="display" style="font-size: 26px; color: var(--charcoal); margin-top: 4px; margin-bottom: 8px;">
        You have been logged out
      </h1>
      <p style="font-size: 14px; color: var(--charcoal-soft); margin-bottom: 24px;">
        Thank you for visiting CnC Supermarket. Your cart items are saved for when you return!
      </p>

      <!-- Buttons -->
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="{% url 'login' %}" class="btn btn-primary" style="justify-content: center; padding: 12px; font-size: 14px;">
          Log Back In
        </a>
        <a href="{% url 'home' %}" class="btn btn-secondary" style="justify-content: center; padding: 12px; font-size: 14px; border-color: var(--line); color: var(--charcoal-soft);">
          Continue Browsing Store
        </a>
      </div>

    </div>
  </div>
</section>
{% endblock %}
