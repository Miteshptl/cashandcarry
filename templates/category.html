{% extends 'base.html' %}

{% block title %}Categories — CnC{% endblock %}

{% block extra_css %}
<style>
  .category-catalog-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (min-width: 576px) {
    .category-catalog-grid {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
    }
  }
  @media (min-width: 860px) {
    .category-catalog-grid {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }
  }

  .cat-card-item {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 8px 12px;
    text-align: center;
    position: relative;
    transition: transform 0.15s ease, border-color 0.15s ease;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .cat-card-item:hover {
    transform: translateY(-3px);
    border-color: var(--leaf);
  }
  .cat-card-item::before {
    content: "";
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 10px;
    background: var(--mist);
    border: 1px solid var(--line);
    border-radius: 50%;
  }

  .cat-card-swatch {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    margin: 0 auto 8px;
    background-size: cover;
    background-position: center;
  }
  @media (min-width: 600px) {
    .cat-card-swatch {
      width: 52px;
      height: 52px;
    }
  }

  .cat-card-item span {
    font-size: 12px;
    font-weight: 600;
    color: var(--charcoal);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.25;
  }
</style>
{% endblock %}

{% block content %}
<section class="section" style="padding: 24px 0 60px; min-height: 70vh;">
  <div class="wrap">
    <div class="section-head" style="margin-bottom: 20px;">
      <h1 class="display" style="font-size: 24px; font-weight: 700; color: var(--charcoal); margin: 0;">Shop by Category</h1>
    </div>
    
    <div class="category-catalog-grid">
      {% for category in categories %}
      <a href="{% url 'category_detail' category.id %}" class="cat-card-item">
        <div class="cat-card-swatch" style="{% if category.get_image %}background-image: url('{{ category.get_image }}');{% else %}background:#DDEEDD;{% endif %}"></div>
        <span>{{ category.name }}</span>
      </a>
      {% empty %}
      <p style="color: var(--charcoal-soft); grid-column: 1 / -1; text-align: center; padding: 32px 0;">No categories found in the database.</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
